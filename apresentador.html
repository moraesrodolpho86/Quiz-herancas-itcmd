<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quiz Heranças — Teste Apresentador</title>
  <style>
    body{font-family:Arial,sans-serif;background:#0b1630;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0;padding:20px}
    .card{max-width:560px;width:100%;background:#16213d;border:2px solid #fff;padding:24px;box-sizing:border-box}
    h1{margin-top:0}
    .ok{color:#63df95;font-weight:700}
    .bad{color:#ff7b7b;font-weight:700}
    code{background:#0f1730;padding:2px 6px}
  </style>
</head>
<body>
  <div class="card">
    <h1>Teste do apresentador</h1>
    <p id="status">Testando conexão com o Firebase...</p>
    <p>Raiz: <code>quizHerancasV2</code></p>
  </div>

<script>
const DB_BASE = "https://quiz-herancas-itcmd-default-rtdb.firebaseio.com";
const ROOT = "quizHerancasV2";

async function setJson(path, value) {
  const r = await fetch(`${DB_BASE}/${ROOT}/${path}.json`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(value)
  });
  if (!r.ok) throw new Error("Falha ao gravar: " + r.status);
}

async function getJson(path) {
  const r = await fetch(`${DB_BASE}/${ROOT}/${path}.json?ts=${Date.now()}`, {
    cache: "no-store"
  });
  if (!r.ok) throw new Error("Falha ao ler: " + r.status);
  return await r.json();
}

(async () => {
  const status = document.getElementById("status");
  try {
    const payload = {
      role: "apresentador",
      message: "Firebase conectado — apresentador",
      timestamp: Date.now()
    };
    await setJson("connectionTest/presenter", payload);
    const back = await getJson("connectionTest/presenter");

    if (back && back.message === payload.message) {
      status.textContent = "Firebase conectado — apresentador";
      status.className = "ok";
    } else {
      throw new Error("Leitura diferente do valor gravado.");
    }
  } catch (err) {
    status.textContent = "Erro de conexão: " + err.message;
    status.className = "bad";
  }
})();
</script>
</body>
</html>

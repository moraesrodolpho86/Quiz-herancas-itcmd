<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quiz — Heranças, desigualdade e ITCMD</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <div class="brand"><h1>Heranças, desigualdade e ITCMD</h1><span class="badge" id="modeBadge">Modo demonstração</span></div>

    <section id="joinScreen" class="card center">
      <div style="font-size:58px">🏁</div>
      <h2>Entre na corrida</h2>
      <p class="subtitle">Digite duas iniciais — podem ser letras ou números. Cada resposta correta faz seu corredor avançar.</p>
      <div class="initials"><input id="initials" maxlength="2" autocomplete="off" placeholder="RM" /><button id="joinBtn">ENTRAR NA CORRIDA</button></div>
      <p class="mini">Não é necessário instalar aplicativo.</p>
    </section>

    <section id="quizScreen" class="card hidden">
      <div class="topbar"><strong id="playerName">RM</strong><div class="progress"><div id="progressBar"></div></div><span id="questionCounter">1 / 6</span></div>
      <div id="questionText" class="question"></div>
      <div id="options" class="options"></div>
      <div id="feedback" class="feedback hidden"></div>
      <div style="margin-top:16px;text-align:right"><button id="nextBtn" class="hidden">PRÓXIMA</button></div>
      <div class="race-wrap">
        <div class="race-title"><span>LARGADA</span><span>CHEGADA 🏁</span></div>
        <div class="track" id="track"><div class="runner" id="runner">🏃<span class="runner-label" id="runnerLabel"></span></div></div>
      </div>
    </section>

    <section id="finishScreen" class="card center hidden">
      <div style="font-size:58px">🏁</div>
      <h2>Corrida encerrada</h2>
      <div class="finish-score"><span id="scoreFinal">0</span>/6</div>
      <p id="finishText" class="subtitle"></p>
      <button id="restartBtn">JOGAR NOVAMENTE</button>
    </section>
  </main>

  <script src="questions.js"></script>
  <script src="firebase-config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>

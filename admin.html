<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel do apresentador</title><link rel="stylesheet" href="style.css"></head>
<body class="admin-page">
<main class="container wide">
  <div class="brand"><div><div class="eyebrow">CONTROLE DO QUIZ</div><h1>Painel do apresentador</h1></div><span class="badge" id="adminStatus">Aguardando Firebase</span></div>
  <section class="dashboard-stats">
    <div class="stat playful"><span>👥 Online</span><strong id="onlineCount">0</strong></div>
    <div class="stat playful"><span>🏁 Finalizaram</span><strong id="finishedCount">0</strong></div>
    <div class="stat playful"><span>⭐ Maior pontuação</span><strong id="topScore">0</strong></div>
  </section>
  <section class="card">
    <div class="stage-heading"><div><span class="stage-kicker">TEMPO REAL</span><h2>Jogadores</h2></div><span class="mini">Ordenados por pontuação</span></div>
    <div id="adminPlayers" class="admin-player-list"></div>
  </section>
</main>
<script src="questions.js"></script><script src="firebase-config.js"></script><script type="module" src="admin.js"></script>
</body></html>
